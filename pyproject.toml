[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agentflight"
version = "0.1.0.dev0"
description = "Black box recorder for AI agents: record, replay and debug agent runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Deepanshu Gautam" }]
dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "httpx>=0.27",
]

[project.scripts]
agentflight-server = "agentflight.server.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
# Integrations: only needed for the frameworks you use.
openai = ["openai>=1.0"]
langgraph = ["langgraph>=1.0"]
dev = [
    "agentflight[server,openai,langgraph]",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
