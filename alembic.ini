[alembic]
# The migrations ship inside the package, so an installed server can run them too
# (`agentflight-server migrate`).
script_location = agentflight.server:migrations
# URL comes from AGENTFLIGHT_DATABASE_URL (see src/agentflight/server/migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
