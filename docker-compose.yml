services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentflight
      POSTGRES_PASSWORD: agentflight
      POSTGRES_DB: agentflight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflight"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: .
    environment:
      AGENTFLIGHT_DATABASE_URL: postgresql+psycopg://agentflight:agentflight@postgres:5432/agentflight
      # Required. Generate one, e.g. `export AGENTFLIGHT_API_KEY=$(openssl rand -hex 32)`.
      AGENTFLIGHT_API_KEY: ${AGENTFLIGHT_API_KEY:?set AGENTFLIGHT_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 30

  cleanup:
    build: .
    command: ["agentflight-server", "cleanup", "--loop"]
    environment:
      AGENTFLIGHT_DATABASE_URL: postgresql+psycopg://agentflight:agentflight@postgres:5432/agentflight
      AGENTFLIGHT_RETENTION_ENABLED: ${AGENTFLIGHT_RETENTION_ENABLED:-true}
      AGENTFLIGHT_RETENTION_DAYS: ${AGENTFLIGHT_RETENTION_DAYS:-30}
      AGENTFLIGHT_CLEANUP_INTERVAL_HOURS: ${AGENTFLIGHT_CLEANUP_INTERVAL_HOURS:-24}
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
