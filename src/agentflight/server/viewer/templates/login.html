{% extends "base.html" %}
{% block title %}Sign in · AgentFlight{% endblock %}
{% block main %}
<section class="login">
  <h1>Sign in</h1>
  <p class="muted">Use an API key with the <code>read</code> permission. The viewer is read-only and never stores the key itself.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login">
    <label for="key">API key</label>
    <input id="key" name="key" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
