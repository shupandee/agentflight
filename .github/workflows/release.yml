# Publishes agentflight-sdk to PyPI when a version tag (v*) is pushed, only after the
# full CI suite passes, using PyPI Trusted Publishing:
# PyPI trusts this workflow's OIDC token, so no API token is stored anywhere. The
# publisher must be registered on PyPI first (repository shupandee/agentflight, workflow
# release.yml, environment pypi).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: The tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/agentflight/__init__.py').read_text())[1])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[server]"
          cd /tmp && /tmp/smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentflight-sdk
    permissions:
      id-token: write  # Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
