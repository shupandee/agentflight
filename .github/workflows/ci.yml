name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentflight
          POSTGRES_PASSWORD: agentflight
          POSTGRES_DB: agentflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentflight"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      AGENTFLIGHT_TEST_DATABASE_URL: postgresql+psycopg://agentflight:agentflight@localhost:5432/agentflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Alembic migration on Postgres
        run: alembic upgrade head && alembic downgrade base
        env:
          AGENTFLIGHT_DATABASE_URL: ${{ env.AGENTFLIGHT_TEST_DATABASE_URL }}
      - run: pytest -q
