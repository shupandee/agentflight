name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[server]"
          cd /tmp && /tmp/smoke/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentflight
          POSTGRES_PASSWORD: agentflight
          POSTGRES_DB: agentflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentflight"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      AGENTFLIGHT_TEST_DATABASE_URL: postgresql+psycopg://agentflight:agentflight@localhost:5432/agentflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Alembic migration on Postgres
        run: alembic upgrade head && alembic downgrade base
        env:
          AGENTFLIGHT_DATABASE_URL: ${{ env.AGENTFLIGHT_TEST_DATABASE_URL }}
      - run: pytest -q

  viewer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: Viewer smoke test in a real browser
        run: pytest -q tests/test_viewer_browser.py -rs
        env:
          AGENTFLIGHT_SCREENSHOT_DIR: viewer-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: viewer-screenshots
          if-no-files-found: ignore

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate a throwaway API key
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "AGENTFLIGHT_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Start stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Show service health
        run: docker compose ps
      - run: pip install -e .
      - name: Run toy agent and check persisted totals
        run: python scripts/compose_smoke.py
      - name: Server logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
